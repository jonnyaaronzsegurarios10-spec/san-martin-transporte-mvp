services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sanmartin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sanmartin"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
volumes:
  postgres_data:
