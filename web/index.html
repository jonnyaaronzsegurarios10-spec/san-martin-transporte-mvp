<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>San Martín Transporte</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><h1>San Martín Transporte</h1><p>Flujo MVP conectado al backend</p></header><section class="card"><h2>Acceso</h2><div class="grid"><input id="phone" placeholder="Teléfono / admin@sanmartin.local" value="demo-passenger"><input id="name" placeholder="Nombre" value="Pasajero Demo"><input id="password" type="password" placeholder="Contraseña" value="Passw0rd!"><select id="role"><option value="PASSENGER">Pasajero</option><option value="DRIVER">Conductor</option></select></div><div class="actions"><button onclick="register()">Registrarse</button><button onclick="login()">Iniciar sesión</button></div><p id="authStatus" class="muted"></p></section><section id="passenger" class="card hidden"><h2>Pasajero</h2><div class="grid"><select id="city"><option>Moyobamba</option><option>Tarapoto</option><option>Nueva Cajamarca</option><option>Rioja</option><option>Soritor</option></select><select id="payment"><option value="CASH">Efectivo</option><option value="YAPE">Yape</option><option value="PLIN">Plin</option><option value="TRANSFER">Transferencia</option></select><input id="pickup" value="-6.034, -76.972" placeholder="Origen lat,lng"><input id="destination" value="-6.052, -76.966" placeholder="Destino lat,lng"></div><div class="actions"><button onclick="estimate()">Calcular estimación</button><button onclick="requestRide()">Solicitar automóvil</button><button onclick="subscribeVip()">Activar VIP demo</button><button onclick="scheduleRide()">Programar reserva VIP</button></div><pre id="passengerResult"></pre></section><section id="driver" class="card hidden"><h2>Conductor</h2><p id="driverGate" class="muted">Completa perfil y espera aprobación administrativa.</p><div class="grid"><input id="plate" value="ABC-123" placeholder="Placa"><input id="make" value="Toyota" placeholder="Marca"><input id="model" value="Yaris" placeholder="Modelo"><input id="color" value="Blanco" placeholder="Color"></div><div class="actions"><button onclick="saveDriver()">Guardar perfil</button><button onclick="toggleAvailability()">Estoy disponible</button></div><div id="offers"></div><pre id="driverResult"></pre></section><section id="admin" class="card hidden"><h2>Administración</h2><button onclick="loadDashboard()">Actualizar dashboard</button><button onclick="loadDrivers()">Revisar conductores</button><pre id="adminResult"></pre></section><section class="card"><h2>Estado del viaje</h2><pre id="rideResult">Aún no hay viaje activo.</pre><div class="actions"><button onclick="setStatus('DRIVER_ARRIVING')">Conductor llega</button><button onclick="setStatus('DRIVER_WAITING')">Esperando</button><button onclick="setStatus('IN_PROGRESS')">Iniciar viaje</button><button onclick="setStatus('COMPLETED')">Finalizar</button><button onclick="rateRide()">Calificar 5/5</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
